name: VeriCrypt Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-v4-${{ hashFiles('**/Cargo.lock') }}
      - name: Build binary
        run: cargo build --release -p vericrypt
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt
          path: target/release/vericrypt
