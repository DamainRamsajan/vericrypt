name: VeriCrypt Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Master Build 9
        run: bash batch_09.sh
      - name: Build and test
        run: cargo test --release -p vericrypt
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-linux-x86_64
          path: target/release/vericrypt
