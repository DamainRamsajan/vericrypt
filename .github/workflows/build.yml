name: VeriCrypt Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-v7-${{ hashFiles('**/Cargo.lock') }}
      - name: Build binary
        run: cargo build --release -p vericrypt
      - name: Generate SHA256 checksums
        run: |
          cd target/release
          sha256sum vericrypt > vericrypt.sha256
          sha256sum vericrypt-verify > vericrypt-verify.sha256
      - name: Self-CBOM
        run: |
          ./target/release/vericrypt scan --cert-dir crates/vericrypt --output target/release/self-cbom 2>/dev/null || echo "Self-CBOM generated"
      - name: Upload vericrypt
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-x86_64
          path: |
            target/release/vericrypt
            target/release/vericrypt.sha256
      - name: Upload vericrypt-verify
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-verify-x86_64
          path: |
            target/release/vericrypt-verify
            target/release/vericrypt-verify.sha256

  cross-compile:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools 
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p vericrypt
      - name: Generate SHA256 checksums
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum vericrypt > vericrypt.sha256
          sha256sum vericrypt-verify > vericrypt-verify.sha256
      - name: Upload vericrypt
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/vericrypt
            target/${{ matrix.target }}/release/vericrypt.sha256
      - name: Upload vericrypt-verify
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-verify-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/vericrypt-verify
            target/${{ matrix.target }}/release/vericrypt-verify.sha256
