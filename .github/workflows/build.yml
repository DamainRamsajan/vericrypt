name: VeriCrypt Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Type check
        run: cargo check -p vericrypt
      - name: Run tests
        run: cargo test -p vericrypt
      - name: Build release binary
        run: cargo build --release -p vericrypt
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-linux-x86_64
          path: target/release/vericrypt
