name: VeriCrypt Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Master Build 9
        run: bash batch_09.sh
      - name: Run Master Build 10
        run: bash batch_10.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-linux-x86_64
          path: target/release/vericrypt
