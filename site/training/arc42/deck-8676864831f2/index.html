<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>arc42 workshop slides</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="notes" role="note"></div>
<div id="cd" aria-live="polite"></div>
<div class="recb"><i></i>REC</div>
<div id="fsask">Recording. Click or press any key to return to full screen.</div>
<div id="ov"><div id="ovg"></div></div>
<div id="hud">
<button id="b-prev" aria-label="Previous slide">Back</button><button id="b-next" aria-label="Next slide">Next</button>
<button id="b-ov">Overview (O)</button><button id="b-nt">Notes (N)</button><button id="b-pr">Presenter window (P)</button><button id="b-fs">Full screen (F)</button><button id="b-tm">Timer (T)</button><button id="b-ex">Exercise countdown (E)</button><button id="b-sk">Skip optional (S)</button><button id="b-rec">Record (R)</button>
<span id="cnt"></span>
</div>
<script src="slides.js"></script>
</body>
</html>
