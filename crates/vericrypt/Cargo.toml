[package]
name = "vericrypt"
version = "0.1.0"
edition = "2021"
description = "Cryptographic inventory, post-quantum exposure findings and offline-verifiable evidence"
license = "UNLICENSED"
repository = "https://github.com/intellica-ai-llc/vericrypt"

[[bin]]
name = "vericrypt"
path = "src/main.rs"

# Licence issuing tool: for the vendor only. Never ship this binary to customers.
[[bin]]
name = "vericrypt-license"
path = "src/bin/vericrypt_license.rs"
required-features = ["issuer"]

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
x509-parser = { workspace = true }
rustls-pemfile = { workspace = true }
walkdir = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
pasetors = "0.7.8"
ed25519-compact = { version = "2", optional = true }
slh-dsa = "0.1.0"
sha2 = "0.10"
# TLS probe: rustls with the `ring` provider (no OpenSSL, so one self-contained binary)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
default = []
license-gate = []
issuer = ["dep:ed25519-compact"]
