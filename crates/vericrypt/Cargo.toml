[package]
name = "vericrypt"
version = "0.1.0"
edition = "2021"
description = "Post-quantum cryptographic compliance engine — single air-gapped binary"
license = "UNLICENSED"
repository = "https://github.com/intellica-ai-llc/vericrypt"

[[bin]]
name = "vericrypt"
path = "src/main.rs"

[[bin]]
name = "vericrypt-verify"
path = "src/verify_main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
x509-parser = { workspace = true }
rustls-pemfile = { workspace = true }
der = { workspace = true }
petgraph = { workspace = true }
walkdir = { workspace = true }
csv = { workspace = true }
ipnet = { workspace = true }
which = { workspace = true }
hostname = { workspace = true }
dirs = { workspace = true }
zstd = { workspace = true }
pqcrypto-sphincsplus = { workspace = true }
pqcrypto-traits = { workspace = true }
cyclonedx-bom = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-rustls = { workspace = true }
native-tls = { workspace = true }
nix = { version = "0.29", features = ["ioctl"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "scan_benchmarks"
harness = false
